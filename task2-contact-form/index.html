<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrapper">
    <section class="form-card">
      <h1>Contact Us</h1>
      <p class="intro">Fill in the form below and we will get back to you soon.</p>

     
      <form id="contactForm" novalidate>

        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" autocomplete="name">
          <small class="error" id="nameError"></small>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <small class="error" id="emailError"></small>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="How can we help?">
          <small class="error" id="subjectError"></small>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
          <small class="error" id="messageError"></small>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
        <p class="success" id="successMsg" role="status"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
